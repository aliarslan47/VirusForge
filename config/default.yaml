# VirusForge varsayılan config. Kullanıcı config'i bunu derin-merge ile ezer.
general:
  threads: 8
  memory_gb: 32
  mode: auto            # auto | short | long | hybrid | assembly  (override, okuma-tipi ekseni)
  molecule: auto        # auto | dna | rna  (DNA/faj vs RNA virüs yolu; read-tipine DİK eksen)
  keep_native: true

detect:
  short_max_len: 500    # ortalama read uzunluğu bu altındaysa short adayı
  long_min_len: 1000    # bu üstündeyse long adayı

tools:
  fastp:
    extra_args: ""
  filtlong:
    min_length: 1000
    keep_percent: 90
  # long-okuma araçları (NanoPlot/filtlong/Flye/Medaka/Unicycler) izole env'de
  long:
    conda_env: vf_long
    conda_bin: /home/ali/miniconda3/bin/conda
  spades:
    careful: true
  flye:
    # kimya kaliteye-göre otomatik (Q<13→r9/--nano-raw); override: r9 | r10
    chemistry: auto
    # max-kapsamın bu oranı altındaki contig'ler junk sayılır (host/kimera) ve elenir
    min_cov_fraction: 0.1
  medaka:
    model: auto         # kimyaya göre; override edilebilir
  unicycler:
    mode: normal
  genomad:
    db: databases/genomad
  mash:
    inphared_sketch: databases/inphared/inphared.msh
  pharokka:
    db: databases/pharokka
  checkv:
    db: databases/checkv
  phabox:
    db: databases/phabox
    conda_env: vf_phabox          # phabox izole env (pandas<2 uyumlu)
    conda_bin: /home/ali/miniconda3/bin/conda
  # --- M2-A faj zenginleştirme (izole env'ler — çalışan virusforge env'i korunur) ---
  amrfinder:
    db: ""                        # boş = AMRFinderPlus varsayılan kurulum DB
    use_abricate: false           # opsiyonel VFDB/CARD hook (varsayılan kapalı)
    conda_env: vf_amr
    conda_bin: /home/ali/miniconda3/bin/conda
  # --- M3 karşılaştırmalı & filogeni (online BLAST + MAFFT/IQ-TREE2 + taxmyPHAGE) ---
  comparative:
    blast_db: ref_viruses_rep_genomes   # online NCBI viral DB (indirme yok)
    blast_timeout: 120                  # sn — Blast4 erişilemezse asılma, V05 fallback'e düş
    iqtree_bin: iqtree                  # v3 = 'iqtree'; bazı sistemlerde 'iqtree2'
    n_closest: 5
    min_hits: 3
    ref_cache: databases/ref_cache
    conda_env: ""                       # gerekirse vf_phylo
    conda_bin: /home/ali/miniconda3/bin/conda

  # --- M2-B RNA-virüs yolu Faz 1 (izole vf_rna/vf_vadr env'leri) ---
  rna:
    reference: ""                 # referans FASTA verilirse → referans-tabanlı iVar konsensus; yoksa rnaviralSPAdes
    primer_bed: ""                # ARTIC amplikon primer BED (ivar trim); boşsa kırpma atlanır
    conda_env: vf_rna             # minimap2 / samtools / ivar
    conda_bin: /home/ali/miniconda3/bin/conda
    ivar_min_depth: 10            # konsensus min derinlik
    ivar_min_freq: 0.5            # konsensus min frekans
    gff: ""                       # opsiyonel: iVar variants AA/codon etkisi için GFF
    ivar_var_min_q: 20            # varyant min kalite (Faz 2)
    ivar_var_min_freq: 0.03       # varyant min frekans (minör/quasispecies dahil)
  lofreq:                         # düşük-frekanslı (quasispecies) varyant çağırma (izole env)
    conda_env: vf_lofreq
    conda_bin: /home/ali/miniconda3/bin/conda
    min_cov: 10
  vadr:
    db: databases/vadr
    model: sarscov2               # v-annotate.pl --mkey
    conda_env: vf_vadr
    conda_bin: /home/ali/miniconda3/bin/conda

optional:                # default kapalı (tasarım kararı)
  virsorter2: false
  vibrant: false
  sourmash: false
  kraken2: false
